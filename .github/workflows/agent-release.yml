name: Build and release cf-san Agent

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm exec wrangler d1 migrations apply cf-san-ip --local
      - run: go test ./...
        working-directory: agent
      - run: go vet ./...
        working-directory: agent
      - run: sh scripts/install_test.sh
        working-directory: agent

  installer-integration:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [debian:bookworm-slim, debian:trixie-slim, alpine:3.18, alpine:3.22, alpine:3.23]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
      - name: Prepare local cf-san release fixture
        working-directory: agent
        run: |
          set -eu
          fixture="$RUNNER_TEMP/cf-san-installer-fixture"
          mkdir -p "$fixture"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o "$fixture/cf-san" ./cmd/cf-san
      - name: Exercise installer in ${{ matrix.image }}
        env:
          CONTAINER_IMAGE: ${{ matrix.image }}
          FIXTURE_DIR: ${{ runner.temp }}/cf-san-installer-fixture
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/agent/scripts:/repo/scripts:ro" \
            -v "$FIXTURE_DIR:/fixtures:ro" \
            -e CF_SAN_FIXTURE_DIR=/fixtures \
            -e CF_SAN_MOCKED_TEST_IN_CONTAINER=1 \
            "$CONTAINER_IMAGE" /bin/sh /repo/scripts/install_mocked_test.sh

  build:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
      - name: Build cf-san agent
        working-directory: agent
        env:
          CGO_ENABLED: 0
          GOARCH: ${{ matrix.arch }}
          GOOS: linux
        run: |
          set -eu
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          mkdir -p "$work/out"
          go build -trimpath -ldflags="-s -w -X cf-san/internal/buildinfo.Version=${GITHUB_REF_NAME} -X cf-san/internal/buildinfo.Repository=${GITHUB_REPOSITORY}" -o "$work/out/cf-san" ./cmd/cf-san
          # Cross-compiled binaries cannot run on the amd64 GitHub runner.
          # Inspect the ELF architecture for every build, and only execute the
          # native binary as a smoke test.
          file "$work/out/cf-san"
          case "$GOARCH" in
            amd64) file "$work/out/cf-san" | grep -q 'x86-64' ;;
            arm64) file "$work/out/cf-san" | grep -Eq 'ARM aarch64|ARM64' ;;
            *) echo "unsupported release architecture: $GOARCH" >&2; exit 1 ;;
          esac
          case "$(uname -m)" in
            x86_64|amd64) HOST_GOARCH=amd64 ;;
            aarch64|arm64) HOST_GOARCH=arm64 ;;
            *) HOST_GOARCH=unknown ;;
          esac
          if [ "$GOARCH" = "$HOST_GOARCH" ]; then
            version_output=$("$work/out/cf-san" version)
            expected_version="cf-san ${GITHUB_REF_NAME} (${GITHUB_REPOSITORY})"
            if [ "$version_output" != "$expected_version" ]; then
              echo "unexpected version output: $version_output" >&2
              exit 1
            fi
            "$work/out/cf-san" configure \
              --config "$work/config.json" \
              --url https://worker.example \
              --token release-smoke-test >/dev/null
            test -s "$work/config.json"
          fi
          archive="cf-san_linux_${GOARCH}.tar.gz"
          tar -C "$work/out" -czf "$archive" cf-san
          sha256sum "$archive" > "$archive.sha256"
          mkdir -p release-assets
          mv "$archive" "$archive.sha256" release-assets/
      - uses: actions/upload-artifact@v4
        with:
          name: cf-san-linux-${{ matrix.arch }}
          path: agent/release-assets/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cf-san-linux-*
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          gh release create "$TAG_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "cf-san ${TAG_NAME}" \
            --generate-notes
